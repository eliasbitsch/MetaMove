<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; media-src 'self' blob:">
  <title>MetaMove - Headset view</title>
  <link rel="stylesheet" href="../node_modules/@fontsource-variable/figtree/index.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/barlow-semi-condensed/600.css">
  <link rel="stylesheet" href="stream.css">
</head>
<body data-live="false">
  <!-- left eye, cropped to 16:9; the source gets wired later -->
  <video id="video" autoplay muted playsinline></video>

  <div class="waiting">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-2.6a2 2 0 0 1-1.6-.8l-.5-.7a1 1 0 0 0-1.6 0l-.5.7a2 2 0 0 1-1.6.8H6.5a3 3 0 0 1-3-3z"/></svg>
    <p>Waiting for the headset</p>
    <span>Put it on to wake the display</span>
  </div>

  <header class="bar">
    <div class="title">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" class="mark-bg"/>
        <path d="M5.5 22.5V10l5.25 7L16 10v12.5" class="mark-m"/>
        <path d="M16 22.5V10l5.25 7L26.5 10v12.5" class="mark-m mark-m2"/>
      </svg>
      Headset view
      <span class="live">Live</span>
    </div>
    <div class="tools">
      <button id="pin" aria-label="Keep on top" title="Keep on top">
        <svg viewBox="0 0 16 16"><path d="M6 2.5h4M7 2.5v4L4.5 9h7L9 6.5v-4M8 9v4.5"/></svg>
      </button>
      <button data-win="full" aria-label="Full screen" title="Full screen">
        <svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
      </button>
      <button data-win="close" aria-label="Close" title="Close" class="close">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </header>

  <script src="stream.js"></script>
</body>
</html>
